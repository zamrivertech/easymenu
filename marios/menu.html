<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mario's Restaurant e Bar | Menu</title>
  <meta name="author" content="Mario's Restaurant e Bar" />
  <meta property="og:description" content="Explore o nosso menu completo e faça o seu pedido no Mario's Restaurant e Bar." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_MZ" />
  <link rel="icon" href="./img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="./style.css" />
  <style>

    body {
      background-color: var(--color-bg);
    }

  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <ul>
      <li><a href="./index.html">Início</a></li>
      <li><img src="./img/favicon.png" width="35" alt="Mario's Logo"/></li>
      <li><a href="./index.html#about">Sobre</a></li>
    </ul>

    <div class="nav-pills-container">
      <div class="nav-pills">
        <!-- Nav pills will be injected here -->
      </div>
    </div>
  </nav>

  <br><br><br><br>


  <div class="menu">
    <!-- Menu cards will be injected here -->
  </div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="./menu.js"></script>
  <script>
    MenuApp.renderDigitalMenu();
    

function animateDigitalMenu() {

  gsap.registerPlugin(ScrollTrigger);

  // Initial states
  gsap.set(".nav-pills a", { autoAlpha: 0, y: -20 });
  gsap.set(".category-card", { autoAlpha: 0, y: 40 });
  gsap.set(".plate", { autoAlpha: 0, x: -20 });

  // Navbar animation
  gsap.to(".nav-pills a", {
    y: 0,
    autoAlpha: 1,
    duration: 0.4,
    stagger: 0.05
  });

  // Cards
  gsap.utils.toArray(".category-card").forEach((card) => {

    gsap.to(card, {
      y: 0,
      autoAlpha: 1,
      duration: 0.6,
      ease: "power3.out",
      scrollTrigger: {
        trigger: card,
        start: "top 85%",
        once: true
      }
    });

    gsap.to(card.querySelectorAll(".plate"), {
      x: 0,
      autoAlpha: 1,
      duration: 0.35,
      stagger: 0.05,
      ease: "power2.out",
      scrollTrigger: {
        trigger: card,
        start: "top 85%",
        once: true
      }
    });

  });

}
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="author" content="Mario's Restaurant e Bar" />
  <meta property="og:description" content="Explore o nosso menu completo e faça o seu pedido no Mario's Restaurant e Bar." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_MZ" />
  <link rel="icon" href="./img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="./style.css" />
  <style>
    body {
      background-image: url('./img/menu_bg.png');
      background-size: 100%;
      background-attachment: fixed;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <ul>
      <li><a href="./index.html">Início</a></li>
      <li><img src="./img/favicon.png" width="35" alt="Mario's Logo"/></li>
      <li><a href="./index.html#about">Sobre</a></li>
    </ul>

    <div class="nav-pills-container">
      <div class="nav-pills">
        <!-- Nav pills will be injected here -->
      </div>
    </div>
  </nav>

  <br><br><br><br>


  <div class="menu">
    <!-- Menu cards will be injected here -->
  </div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="./menu.js"></script>
  <script>
    MenuApp.renderDigitalMenu();
    
    function animateDigitalMenu() {

  if (typeof gsap === "undefined") return;

  // Set initial hidden state BEFORE animation
  gsap.set(".nav-pills a", { y: -20, autoAlpha: 0 });
  gsap.set(".category-card", { y: 40, autoAlpha: 0 });
  gsap.set(".plate", { x: -20, autoAlpha: 0 });

  const tl = gsap.timeline();

  tl.to(".nav-pills a", {
    y: 0,
    autoAlpha: 1,
    duration: 0.4,
    stagger: 0.05,
    ease: "power2.out"
  });

  tl.to(".category-card", {
    y: 0,
    autoAlpha: 1,
    duration: 0.6,
    stagger: 0.15,
    ease: "power3.out"
  }, "-=0.2");

  tl.to(".plate", {
    x: 0,
    autoAlpha: 1,
    duration: 0.35,
    stagger: 0.04,
    ease: "power2.out"
  }, "-=0.5");

}
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart TV Interface</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      font-size: 1.2rem;
      overflow: hidden;
    }

    main {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    main * {
      flex: 1;
      height: 90vh;
      margin: 2rem;
    }

    main .left {
      background: red;
    }

    main .right {
      background: blue;
      display: flex;
      flex-direction: column;
      
    }

    main .right * {
      margin: 0;
    }

    main .right .items * {
      margin: 0;
    }
 
    main .right .all {
      display: flex;
      flex-wrap: wrap;
    }

    main .right .items {
      display: flex;
      flex-direction: column;

    }

    main .right .items .item {
      display: flex;
      height: 0;
      width: 0;
    
    }

    main .right .title {
      font-size: 2rem;
    }



    

  </style>
</head>
<body>
  <main>
    <section class="left">
      <img src="./img/Acompanhamentos.png" alt="">
    </section>
    <section class="right">
      <div class="title">Bebidas</div>
      <div class="all">
        <div class="items">Quentes
          <div class="item">
            <div class="name">Cafe Expresso</div>
            <div class="price">70MT</div>
          </div>
          <div class="item">
            <div class="name">Cafe Duplo</div>
            <div class="price">120MT</div>
          </div>
          <div class="item">
            <div class="name">Black Coffee</div>
            <div class="price">120MT</div>
          </div>  
          <div class="item">
            <div class="name">Expresso Machiato</div>
            <div class="price">150MT</div>
          </div>        
        </div>
        <div class="items">Frias
          <div class="item">
            <div class="name">Cafe Expresso</div>
            <div class="price">70MT</div>
          </div>
          <div class="item">
            <div class="name">Cafe Duplo</div>
            <div class="price">120MT</div>
          </div>
          <div class="item">
            <div class="name">Black Coffee</div>
            <div class="price">120MT</div>
          </div>  
          <div class="item">
            <div class="name">Expresso Machiato</div>
            <div class="price">150MT</div>
          </div>        
        </div>
      </div>
    </section>
  </main>
</body>
</html>

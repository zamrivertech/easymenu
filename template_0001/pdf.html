
<!DOCTYPE html>
<html lang="pt">
  <meta charset="UTF-8">
  <title>Restaurante No Zavala | Menu A4 PDF</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./img/favicon.png">
</head>
<body>

  <button id="downloadBtn" class="menu-button">Baixar PDF</button>

  <div id="menu"><div id="pages"></div></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
<script src="./menu.js"></script>

<script>
  MenuApp.renderPdfMenu().then(() => {
    const btn = document.getElementById("downloadBtn");
    btn.addEventListener("click", async () => {
      const { jsPDF } = window.jspdf;

      const pagesContainer = document.getElementById("pages");
      const pageElements = Array.from(pagesContainer.querySelectorAll(".page"));

      if (pageElements.length === 0) {
        console.error("No .page elements found to export");
        return;
      }

      const pdf = new jsPDF("p", "pt", "a4");
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = pdf.internal.pageSize.getHeight();

      for (let i = 0; i < pageElements.length; i++) {
        const pageEl = pageElements[i];

        const canvas = await html2canvas(pageEl, {
          scale: 2,
          useCORS: true
        });

        const imgData = canvas.toDataURL("image/png");
        const imgWidth = pdfWidth;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;

        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);
      }

      pdf.save("menu-restaurante-no-zavala.pdf");
    });
  });
</script>


</body>
</html>

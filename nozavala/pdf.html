<!DOCTYPE html>
<html lang="pt">
  <meta charset="UTF-8">
  <title>Restaurante No Zavala | Menu A4 PDF</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <button id="downloadBtn">Baixar PDF</button>

  <div id="menu"><div id="pages"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <script>
    // Convert an image URL to a base64 data URL
    async function convertImageToBase64(url) {
      const response = await fetch(url);
      const blob = await response.blob();
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    // Replace all <img> src with base64 data URLs (for testing)
    async function replaceAllImagesWithBase64() {
      const images = document.querySelectorAll('img');
      for (const img of images) {
        try {
          const base64 = await convertImageToBase64(img.src);
          img.src = base64;
        } catch (e) {
          console.warn('Failed to convert image to base64:', img.src, e);
        }
      }
    }
    // Preload all images in a container, with timeout and error handling
    async function preloadImages(container, timeout = 5000) {
      const images = Array.from(container.querySelectorAll('img'));

      const preloadPromises = images.map(img => {
        return new Promise(resolve => {
          if (img.complete && img.naturalWidth !== 0) {
            resolve(); // Already loaded and valid
          } else {
            const timer = setTimeout(() => resolve(), timeout); // Fallback timeout
            img.onload = () => {
              clearTimeout(timer);
              resolve();
            };
            img.onerror = () => {
              clearTimeout(timer);
              console.warn(`Image failed to load: ${img.src}`);
              resolve(); // Resolve anyway to avoid blocking
            };
          }
        });
      });

      await Promise.all(preloadPromises);
    }
    // Specify the order and grouping of categories. Each sub-array is a page.
    // Example: [['Sanduíches', 'Hambúrgueres'], ['Salgadinhos', 'Acompanhamentos'], ...]
    // Or just a flat array for a single page: ['Sanduíches', 'Hambúrgueres', ...]
    const CATEGORY_ORDER = [
      // Page 1
      ['Cervejas', 'Soft Drinks', 'Vinhos', 'Bebidas Extra', 'Entradas', 'Petiscos'],

      // Page 2
      ['Pizzas', 'Carnes', 'Suína', 'Aves', 'Peixes e Mariscos', 'Filetes de Peixe'],

      // Page 3
      ['Bacalhau', 'Acompanhamento Extra']
    ];

    const SHEET_URL = 'https://gsx2json.com/api?id=1sbaGlBL0KrG9i9jUQZubnc9d-vSif8QCg8JE_o0xELI&sheet=Menu';
    const PAGE_HEIGHT_MM = 297 - 40; // 20mm padding top/bottom
    const PAGE_WIDTH_MM = 210 - 40;  // 20mm padding left/right

    function slugify(text) {
      if (typeof text !== 'string') return '';
      return text.toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]+/g, '');
    }

    // Group items by name for sub-grouping (e.g., chicken portions)
    function groupBy(arr, key) {
      return arr.reduce((acc, item) => {
        (acc[item[key]] = acc[item[key]] || []).push(item);
        return acc;
      }, {});
    }

    function createCategoryBlock(category, items) {
      // Special rendering for Bebidas (drinks) as a table
      if (category === 'Bebidas' ) {
        const block = document.createElement('div');
        block.className = 'category-block';
        block.innerHTML = `<h2>${category}</h2>
          <table style="width:100%; border-collapse:collapse; font-size:0.98em; color:#e22218;">
            <thead><tr><th style='text-align:left;'></th><th style='text-align:right;'></th></tr></thead>
            <tbody>
              ${items.map(item => `
                <tr>
                  <td style='padding:2px 4px;'>${item["Name"]}</td>
                  <td style='text-align:right; padding:2px 4px;'><span class='price'>${item["Price (MT)"]}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
        return block;
      }

      // For categories with repeated names (e.g., chicken portions), group by name
      const grouped = groupBy(items, 'Name');
      const block = document.createElement('div');
      block.className = 'category-block';
      block.innerHTML = `
        <h2>${category}</h2>
        ${Object.keys(grouped).map(name => {
          const group = grouped[name];
          if (group.length === 1) {
            const item = group[0];
            return `<div class="plate">
              <strong>${item["Name"]}</strong>
              <div class="dashed"></div>
              <span class="price">${item["Price (MT)"]} MT</span>
            </div>`;
          } else {
            // Multiple portions/variants for this name
            return `<div class="plate">
              <strong>${name}</strong>
              <table style='width:100%; font-size:0.97em; margin:2px 0;'>
                <tbody>
                  ${group.map(item => `
                    <tr>
                      <td style='padding:2px 4px;'>${item["Description"] || ''}</td>
                      <td style='text-align:right; padding:2px 4px;'>${item["Price (MT)"]} MT</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>`;
          }
        }).join('')}
      `;
      return block;
    }

    function renderMenuPages(categories, items) {
      const pagesDiv = document.getElementById('pages');
      pagesDiv.innerHTML = '';
      // If CATEGORY_ORDER is an array of arrays, treat each as a page
      const isGrouped = Array.isArray(CATEGORY_ORDER[0]);
      const pagesToRender = isGrouped ? CATEGORY_ORDER : [CATEGORY_ORDER];

      pagesToRender.forEach((catGroup, idx) => {
        const page = document.createElement('div');
        page.className = 'page';
        // Add header only to the first page (idx === 0)
        if (idx === 0) {
          const header = document.createElement('div');
          header.className = 'header-info';
          header.innerHTML = `
            <img src="./img/logo.png" alt="No Zavala Logo"><br>
            <strong>Restaurante No Zavala</strong>
          `;
          page.appendChild(header);
        }
        const grid = document.createElement('div');
        grid.className = 'menu-grid';
        catGroup.forEach(category => {
          if (!categories.includes(category)) return; const 
          catItems = items.filter(i => i["Category"] === 
          category); if (catItems.length === 0) return; const 
          block = createCategoryBlock(category, catItems); 
          grid.appendChild(block);
        });
        page.appendChild(grid);
        // Add footer only to the second page (idx === 1)
        if (idx === 2) {
          const footer = document.createElement('div');
          footer.className = 'footer-info';
          footer.innerHTML = `
            <img src="./img/qr-code.png" alt="ExpressChicken Logo" style="height:150px; margin-bottom:8px;">
            <div class='footer-text'>
            <strong>ExpressChicken</strong><br>
            Terça a Domingo, 10:00 - 21:00<br>
            857450424 - 876269817 <br>
            Ao lado do Antigo Cinema, 333, Cidade de Tete<br>
            <span style="font-size:0.95em;">Obrigado pela preferência!</span>
          </div>
                `;
          page.appendChild(footer);
        }
        pagesDiv.appendChild(page);
      });
    }

    fetch('https://gsx2json.com/api?id=1sbaGlBL0KrG9i9jUQZubnc9d-vSif8QCg8JE_o0xELI&sheet=Menu')
      .then(res => res.json())
      .then(data => {
        if (!data.rows) {
          alert("Erro ao carregar o menu.");
          return;
        }
        const items = data.rows;
        const categories = [...new Set(items.map(i => i["Category"]))];
        renderMenuPages(categories, items);
      });

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      await preloadImages(document.getElementById('menu'));
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pages = document.querySelectorAll('.page');

      for (let i = 0; i < pages.length; i++) {
        const canvas = await html2canvas(pages[i], { scale: 2 });
        const imgData = canvas.toDataURL('image/jpeg', 1.0);
        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
      }

      pdf.save('NoZavala_A4.pdf');
    });

  </script>
</body>
</html>

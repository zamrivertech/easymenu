<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpressChicken | Menu Digital</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#ff5722" />
  <style>
    :root {
      --color-bg: #fff8f0;
      --color-primary: #ff5722;
      --color-text: #333;
      --font-family: 'Segoe UI', Roboto, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--font-family);
      background-color: var(--color-bg);
      color: var(--color-text);
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: var(--color-primary);
      padding: 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      z-index: 1000;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    section {
      height: 100vh;
      padding: 5rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #menu {
      background-color: #ffe0cc;
    }

    #contacto {
      background-color: #fff0e6;
    }

    h1, h2 {
      margin-bottom: 1rem;
    }

    p {
      max-width: 600px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#menu">Menu</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <section id="menu">
    <h1>ExpressChicken</h1>
    <h2>Menu Digital</h2>
    <p>Explore os nossos pratos deliciosos, preparados com frango fresco e temperos especiais. Faça o seu pedido diretamente aqui!</p>
  </section>

  <section id="contacto">
    <h2>Contacto</h2>
    <p>Estamos localizados em Tete. Ligue para +258 84 123 4567 ou envie uma mensagem pelo WhatsApp para fazer seu pedido.</p>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zayka | Menu</title>
  <meta name="description" content="Veja o menu completo do Zayka. Comida portuguesa e indiana saborosa em Tete — takeaway e refeições no local." />
  <meta name="keywords" content="Zayka, menu, comida indiana, comida portuguesa, restaurante Tete, takeaway, Moçambique" />
  <meta name="author" content="Zayka Restaurante" />
  <meta property="og:title" content="Zayka | Menu Digital" />
  <meta property="og:description" content="Explore nosso menu completo e faça seu pedido para takeaway." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_MZ" />
  <meta name="theme-color" content="#D4AF37" />
  <link rel="icon" href="./img/logo.png" type="image/x-icon" />
  <link rel="stylesheet" href="./style.css" />
  <style> 
    .category-card:first-child {
      margin-top: 100px;
    }

    .category-card {
      scroll-margin-top: 155px;
    }
  
    nav, .nav-pills-container {
      backdrop-filter: blur(8px);
      height: 100px;
      -webkit-backdrop-filter: blur(8px); /* for Safari */
    }

    nav ul {
     margin-bottom: 38px;
    }

    .category-image {
  width: clamp(80px, 30vw, 120px);
  height: auto;
  display: block;
  margin: 0.75rem auto;
  cursor: pointer;

  border-radius: 14px;
  animation: slow-spin 20s linear infinite;

  transition:
    transform 0.6s ease,
    box-shadow 0.6s ease,
    border-radius 0.6s ease,
    opacity 0.4s ease;
}

/* Slow spin */
@keyframes slow-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* Hover polish */
.category-image:hover {
  animation-play-state: paused;
  transform: scale(1.15);
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* 🔥 TRUE fullscreen mode */
.category-image.is-fullscreen {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;

  width: 100vw !important;
  height: 100vh !important;

  max-width: none !important;
  max-height: none !important;

  object-fit: contain;
  background: rgba(0,0,0,0.92);
  padding: 2rem;
  margin: 0 !important;

  border-radius: 0 !important;
  animation: none !important;
  transform: none !important;

  z-index: 2147483647 !important; /* nuclear z-index */
  cursor: zoom-out;
}

  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <ul>
      <li><a href="./index.html">Início</a></li>
      <li><img src="./img/logo.png" class="logo" /></li>
      <li><a href="./index.html#about">Sobre</a></li>
    </ul>
    <div class="nav-pills-container">
      <div class="nav-pills">
        <!-- Nav pills injected here -->
      </div>
    </div>
  </nav>

  <main>
    <div class="menu">
      <!-- Category cards injected here -->
    </div>
  </main>

  <script src="./menu.js"></script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    MenuApp.renderDigitalMenu();

    gsap.registerPlugin(ScrollTrigger);

    // Animate navbar items
    gsap.from("nav ul li", {
      duration: 1,
      y: -30,
      opacity: 0,
      stagger: 0.2,
      ease: "power3.out"
    });

    // Animate nav pills container
    gsap.from(".nav-pills-container", {
      duration: 1,
      y: -20,
      opacity: 0,
      delay: 0.5,
      ease: "power2.out"
    });

    // Animate category cards when they scroll into view
    gsap.utils.toArray(".category-card").forEach(card => {
      gsap.from(card, {
        scrollTrigger: {
          trigger: card,
          start: "top 85%", // when card enters viewport
        },
        duration: 1,
        y: 40,
        opacity: 0,
        ease: "power2.out"
      });
    });
  </script>

  <script>
document.addEventListener("click", (e) => {
  const img = e.target.closest(".category-image");
  if (!img) return;

  img.classList.toggle("is-fullscreen");

  // prevent body scroll when fullscreen
  document.body.style.overflow =
    img.classList.contains("is-fullscreen") ? "hidden" : "";
});
</script>

</body>
</html>

<!-- index.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyMenu | ZamRiverTech</title>
  <link rel="icon" href="./img/favicon.png" type="image/png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header>
    <img src="./img/favicon.png" alt="Logo EasyMenu" class="logo" />
    <select id="languageSelect" class="lang-select">
      <option value="pt">PT</option>
      <option value="en">EN</option>
    </select>
  </header>

  <main id="home">

    <div class="pill" data-i18n="toppilltext"></div>  

    <h2 data-i18n="title"></h2>

    <div class="btn-container">
      <a class="btn-primary" href="https://wa.me/258871838719" target="_blank" rel="noopener" data-i18n="mainbutton"></a>
      <a class="btn-secondary" href="#" data-i18n="clientbutton"></a>
    </div>

    <img src="./img/qrcode.gif" alt="QR Code" class="qr-icon">

    <div class="marquee">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>

    <section class="about-section" id="about">
        <div class="about-content">
            <h2 data-i18n="about_title"></h2>
            <p data-i18n="about_text"></p>
        </div>
    </section>
  </main>

  <footer>
    <small data-i18n="footer"></small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
